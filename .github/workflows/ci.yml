name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint & Type Check ────────────────────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ── Unit & Integration Tests ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       sentinelscan_test
          POSTGRES_USER:     sentinelscan
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelscan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:            test
      PORT:                3001
      DATABASE_URL:        postgresql://sentinelscan:ci_test_password@localhost:5432/sentinelscan_test
      REDIS_URL:           redis://localhost:6379
      JWT_ACCESS_SECRET:   ci-access-secret-at-least-32-characters-long!!
      JWT_REFRESH_SECRET:  ci-refresh-secret-at-least-32-characters-long!
      JWT_ACCESS_EXPIRY:   15m
      JWT_REFRESH_EXPIRY:  7d
      CORS_ORIGIN:         http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          retention-days: 7

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       apps/api/Dockerfile
          push:       false
          tags:       sentinelscan-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       apps/web/Dockerfile
          push:       false
          tags:       sentinelscan-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Dependency Security Audit ─────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Scoped to production dependencies — dev-tooling CVEs (e.g. Vite's
      # dev-server-only esbuild advisory) never ship and would otherwise
      # force unrelated breaking upgrades just to silence the gate.
      - name: Audit production dependencies for high/critical CVEs
        run: npm audit --omit=dev --audit-level=high
