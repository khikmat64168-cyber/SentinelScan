# Local development — infrastructure only.
#
# The API and web app run locally via `npm run dev` (with hot-reload).
# Only PostgreSQL and Redis run in Docker, with ports exposed to the host
# so local dev tools (psql, redis-cli, TablePlus, etc.) can connect directly.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev     # starts both API and web with hot-reload
#
# Stop:
#   docker compose -f docker-compose.dev.yml down

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sentinelscan}
      POSTGRES_USER:     ${POSTGRES_USER:-sentinelscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelscan}"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_password_change_me}
      --loglevel verbose
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_password_change_me}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
